name: Refresh market snapshot

on:
  schedule:
    - cron: "20 6 * * 1-5"   # weekdays, shortly after TCMB publishes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: node scripts/snapshot.mjs
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Commit if the snapshot changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/snapshot.json
          git diff --staged --quiet || git commit -m "chore: refresh market snapshot"
          git push
